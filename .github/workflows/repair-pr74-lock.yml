name: Repair PR 74 dependency lock

on:
  push:
    branches: [dependabot/npm_and_yarn/npm_and_yarn-c12db4747a]
    paths: [.github/workflows/repair-pr74-lock.yml]

permissions:
  contents: read

jobs:
  repair-lock:
    if: github.repository == 'floriankreutzer/conference-manager-website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the triggering PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - name: Refresh only affected transitive dependency resolutions
        run: npm update brace-expansion undici --package-lock-only --ignore-scripts --no-fund
      - name: Keep the vulnerability gate blocking
        run: npm audit --audit-level=high
      - name: Commit only the repaired lockfile to this PR
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'dependabot/npm_and_yarn/npm_and_yarn-c12db4747a'
          git diff --exit-code -- package.json
          git diff --check
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix(deps): patch brace-expansion and undici security advisories'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
