name: Format typography acceptance test

on:
  push:
    branches: [test/typography-layout-stability]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/typography-layout-stability
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write e2e/fonts.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- e2e/fonts.spec.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/fonts.spec.ts
          git commit -m "Format typography acceptance test"
          git push
