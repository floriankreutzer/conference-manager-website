name: GitHub Pages Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-review
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CM_APP_ORIGIN: https://app.example.invalid
      PUBLIC_PREVIEW: 'true'
      PUBLIC_SITE_ORIGIN: https://floriankreutzer.github.io
      PUBLIC_BASE_PATH: /conference-manager-website/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Governed font asset verification
        run: npm run test:fonts

      - name: Build noindex GitHub Pages review site
        run: npm run build

      - name: Verify static performance budgets
        run: npm run test:performance

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages review site
        id: deployment
        uses: actions/deploy-pages@v4
