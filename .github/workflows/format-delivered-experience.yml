name: Format delivered experience files

on:
  push:
    branches: [feature/delivered-experience-acceptance]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/delivered-experience-acceptance
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only delivered experience scripts
        run: npx prettier --write scripts/deployment/experience-contract.mjs scripts/deployment/experience-contract.test.mjs scripts/deployment/verify-delivered-experience.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/deployment/experience-contract.mjs scripts/deployment/experience-contract.test.mjs scripts/deployment/verify-delivered-experience.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deployment/experience-contract.mjs scripts/deployment/experience-contract.test.mjs scripts/deployment/verify-delivered-experience.mjs
          git commit -m "Format delivered experience scripts"
          git push
