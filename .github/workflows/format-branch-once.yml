name: Format branch once

on:
  push:
    branches:
      - feat/complete-marketing-brand-gaps

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply repository formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/complete-marketing-brand-gaps

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply repository formatting
        run: npx prettier --write "src/**/*.{astro,ts,json}" "e2e/**/*.ts" "scripts/**/*.mjs" "functions/**/*.{js,json}" "*.{js,mjs,json,ts}"

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e scripts functions '*.js' '*.mjs' '*.json' '*.ts' 2>/dev/null || true
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:feat/complete-marketing-brand-gaps
