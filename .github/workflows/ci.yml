name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format-demo-function:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/demo-request-processing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout owned PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format demo function files
        run: npx prettier --write functions/demo-request/handler.js functions/demo-request/handler.test.js functions/demo-request/validation.js

      - name: Commit formatting only
        run: |
          if git diff --quiet -- functions/demo-request/handler.js functions/demo-request/handler.test.js functions/demo-request/validation.js; then
            echo "Demo function formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- functions/demo-request/handler.js functions/demo-request/handler.test.js functions/demo-request/validation.js
          git commit -m "chore: normalize demo function formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CM_APP_ORIGIN: https://app.example.invalid
      PUBLIC_PREVIEW: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Static build performance budgets
        run: npm run test:performance

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, route and accessibility tests
        run: npm run test:e2e

      - name: Upload validated static build
        uses: actions/upload-artifact@v7
        with:
          name: website-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
