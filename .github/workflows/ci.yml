name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-quality-tooling:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout owned PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Refresh lockfile and format governed source
        run: |
          npm install --ignore-scripts
          npm run format

      - name: Commit repository-only bootstrap changes
        run: |
          if git diff --quiet -- package-lock.json package.json src e2e eslint.config.js .prettierrc.mjs astro.config.mjs playwright.config.ts vitest.config.ts; then
            echo "Quality tooling bootstrap already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json package.json src e2e eslint.config.js .prettierrc.mjs astro.config.mjs playwright.config.ts vitest.config.ts
          git commit -m "chore: normalize source formatting and lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CM_APP_ORIGIN: https://app.example.invalid
      PUBLIC_PREVIEW: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Install dependencies for bootstrap validation
        run: npm install --ignore-scripts

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
