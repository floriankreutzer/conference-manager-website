name: Website CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CM_APP_ORIGIN: https://app.example.invalid
      PUBLIC_PREVIEW: 'true'
    steps:
      - name: Require matching Jira key in PR title and branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_TITLE" =~ ^(CO-[1-9][0-9]*)[[:space:]]+[^[:space:]] ]]; then
            echo "::error title=Missing Jira work item key::PR title must start with CO-123 followed by a descriptive title."
            exit 1
          fi
          TITLE_KEY="${BASH_REMATCH[1]}"

          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "Dependabot branch naming is provider-controlled; Jira traceability is enforced through PR key $TITLE_KEY."
            exit 0
          fi

          if [[ ! "$HEAD_REF" =~ (^|[/_-])(CO-[1-9][0-9]*)([/_-]|$) ]]; then
            echo "::error title=Missing Jira branch key::Branch name must contain the PR Jira key, for example CO-123-short-description or feature/CO-123-short-description."
            exit 1
          fi
          BRANCH_KEY="${BASH_REMATCH[2]}"
          if [[ "$BRANCH_KEY" != "$TITLE_KEY" ]]; then
            echo "::error title=Jira key mismatch::Branch key $BRANCH_KEY must match PR key $TITLE_KEY."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Governed font asset verification
        run: npm run test:fonts

      - name: Production build
        run: npm run build

      - name: Static build performance budgets
        run: npm run test:performance

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, route and accessibility tests
        run: npm run test:e2e

      - name: Upload validated static build
        uses: actions/upload-artifact@v7
        with:
          name: website-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
