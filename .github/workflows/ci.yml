name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_CM_APP_ORIGIN: https://app.example.invalid
      PUBLIC_PREVIEW: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Diagnose Prettier diff
        if: failure()
        run: |
          npx prettier --write "src/**/*.{astro,ts,json}" "e2e/**/*.ts" "scripts/**/*.mjs" "functions/**/*.{js,json}" "*.{js,mjs,json,ts}"
          git diff -- . ':!.github/workflows/ci.yml'

      - name: Upload Prettier diagnostic files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-diagnostic-${{ github.sha }}
          path: |
            src/i18n/company.ts
            src/i18n/homepage.ts
            src/i18n/integrations.test.ts
            src/i18n/integrations.ts
            src/i18n/pricing.ts
            src/i18n/securityTrust.ts
            src/layouts/publicPageRoute.test.ts
            e2e/integrations.spec.ts
            e2e/pricing.spec.ts
            e2e/public-site.spec.ts
            e2e/security-trust.spec.ts
            e2e/workplace-teams.spec.ts
          if-no-files-found: error
          retention-days: 1

      - name: Unit tests
        run: npm test

      - name: Governed font asset verification
        run: npm run test:fonts

      - name: Production build
        run: npm run build

      - name: Static build performance budgets
        run: npm run test:performance

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, route and accessibility tests
        run: npm run test:e2e

      - name: Upload validated static build
        uses: actions/upload-artifact@v7
        with:
          name: website-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
