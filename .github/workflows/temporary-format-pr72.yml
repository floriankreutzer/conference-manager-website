name: Temporary PR 72 formatter

on:
  push:
    branches:
      - fix/customer-facing-content-and-visuals
    paths:
      - .github/workflows/temporary-format-pr72.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/customer-facing-content-and-visuals

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply repository formatter
        run: npm run format

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/temporary-format-pr72.yml

      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository formatting"
          git push origin HEAD:fix/customer-facing-content-and-visuals
