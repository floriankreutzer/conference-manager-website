name: Format governed webfont files

on:
  push:
    branches: [feature/governed-webfonts]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/governed-webfonts
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only governed font text files
        run: npx prettier --write src/assets/fonts/manifest.json e2e/fonts.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/assets/fonts/manifest.json e2e/fonts.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/fonts/manifest.json e2e/fonts.spec.ts
          git commit -m "Format governed webfont files"
          git push
