name: Format marketing refactor

on:
  push:
    branches:
      - feat/customer-led-marketing-refactor

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/customer-led-marketing-refactor

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply repository formatter
        run: npm run format

      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e
          git commit -m "style: apply repository formatter"
          git push origin HEAD:feat/customer-led-marketing-refactor
