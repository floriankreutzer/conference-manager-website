name: Delivered Experience Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivered-experience-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate repository and experience contract tests
        run: |
          npm audit --audit-level=high
          npm run check
          npm run lint
          npm run format:check
          npm test
          npm run test:fonts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify delivered typography and experience
        run: node scripts/deployment/verify-delivered-experience.mjs "$PUBLIC_SITE_ORIGIN"

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivered-experience-${{ github.sha }}
          path: artifacts/delivered-experience/
          if-no-files-found: warn
          retention-days: 14

      - name: Record acceptance summary
        if: success()
        run: |
          {
            echo "### Delivered website experience acceptance"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Origin: $PUBLIC_SITE_ORIGIN"
            echo "Result: passed"
            echo
            echo "Validated: median cold-navigation lab LCP <= 2.5s, EN/DE CLS <= 0.1, same-origin fonts and 200% reflow."
            echo "These are controlled lab measurements and do not represent field Core Web Vitals."
          } >> "$GITHUB_STEP_SUMMARY"
